<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: http://127.0.0.1:8765 http://localhost:8765 ws://127.0.0.1:8765 ws://localhost:8765 ws://localhost:5173; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self';"
    />
    <!-- frame-ancestors removed: only valid via HTTP header, not <meta>. X-Frame-Options DENY is set by the FastAPI middleware for same-origin /api responses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap"
    />
    <title>Helix — SDLC Copilot</title>
    <script>
      (function () {
        try {
          var k = 'helix_theme',
            d = document.documentElement,
            v = localStorage.getItem(k)
          if (v === 'dark') d.classList.add('dark')
          else if (v === 'light') d.classList.remove('dark')
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            d.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:8765 http://localhost:8765 ws://127.0.0.1:8765 ws://localhost:5173; font-src 'self' data:; object-src 'none'; base-uri 'self';"
    />
    <title>Helix — SDLC Copilot</title>
    <script>
      (function () {
        try {
          var k = 'helix_theme',
            d = document.documentElement,
            v = localStorage.getItem(k)
          if (v === 'dark') d.classList.add('dark')
          else if (v === 'light') d.classList.remove('dark')
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            d.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

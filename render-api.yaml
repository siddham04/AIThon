# Render Blueprint — API only (use with Vercel for the UI).
#
# Builds with the slim `requirements-render.txt` (default in
# `helix-backend/Dockerfile`) — fits Render Free 512 MB RAM.
# Drops sentence-transformers + PyTorch + faiss + scikit-learn +
# spacy (~460 MB build saving, ~250 MB runtime); every drop is a
# lazy import with heuristic fallback (see
# helix-backend/requirements-render.txt for the full reasoning).
# Golden + adversarial pipeline tests pass 28/28 with these absent.
#
# Need full ML stack? Override `REQUIREMENTS_FILE=requirements.txt`
# in Render dashboard build args and upgrade to Starter (1 GB).
#
# Dashboard: New → Blueprint → this repo → select render-api.yaml
# Or on an existing Web Service set:
#   Root Directory = helix-backend
#   Dockerfile Path = Dockerfile

services:
  - type: web
    name: helix-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: helix-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: HELIX_CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: HELIX_DEMO_FAST
        value: "true"
      - key: HELIX_HACKATHON_AUTH
        value: "true"
      - key: HELIX_DEMO_EMAIL
        value: "demo@demo.com"
      - key: HELIX_DEMO_PASSWORD
        value: "demo123"
      # Defensive: even when the slim install drops sentence-transformers
      # entirely, this env keeps `rag_service` from attempting any
      # embeddings work. Belt-and-suspenders with `requirements-render.txt`.
      - key: HELIX_DISABLE_EMBEDDINGS
        value: "1"

databases: []

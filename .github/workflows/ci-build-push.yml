name: Build and Publish Docker Images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Expose whether the optional K8s deploy is configured so the
    # downstream `deploy-to-k8s` job can gate itself. GitHub Actions
    # does NOT allow the `secrets` context in a job-level `if:`, so
    # this is the canonical workaround — surface the check as a job
    # output and let the dependent job read it.
    outputs:
      can_deploy_k8s: ${{ steps.k8s_gate.outputs.can_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect K8s deploy availability
        id: k8s_gate
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "${KUBE_CONFIG_DATA:-}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "K8s deploy will run — KUBE_CONFIG_DATA is present."
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "K8s deploy will be skipped — KUBE_CONFIG_DATA not set."
          fi
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./helix-frontend
          file: ./helix-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-thon-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ai-thon-frontend:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-thon-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-thon-frontend:cache,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./helix-backend
          file: ./helix-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-thon-backend:latest
            ghcr.io/${{ github.repository_owner }}/ai-thon-backend:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-thon-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-thon-backend:cache,mode=max

  deploy-to-k8s:
    # `secrets` is NOT available in job-level `if:` — gate on the job
    # output exposed by `build-and-push.k8s_gate` instead.
    needs: build-and-push
    if: needs.build-and-push.outputs.can_deploy_k8s == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config
        shell: bash

      - name: Substitute GHCR owner in manifests
        run: |
          sed -i "s|REPLACE_OWNER|${{ github.repository_owner }}|g" k8s/backend.yaml k8s/frontend.yaml
        shell: bash

      - name: Apply Kubernetes namespace
        run: |
          kubectl apply -f k8s/namespace.yaml
        shell: bash

      - name: Create GHCR image pull secret
        run: |
          kubectl -n helix create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ secrets.GHCR_USERNAME }}" \
            --docker-password="${{ secrets.GHCR_PAT }}" \
            --docker-email="${{ secrets.GHCR_EMAIL }}" \
            --dry-run=client -o yaml | kubectl apply -f -
        shell: bash

      - name: Create backend runtime secrets
        run: |
          kubectl -n helix create secret generic helix-backend-secrets \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
            --from-literal=AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
            --from-literal=AZURE_OPENAI_DEPLOYMENT="${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
            --from-literal=AZURE_OPENAI_API_VERSION="${{ secrets.AZURE_OPENAI_API_VERSION }}" \
            --dry-run=client -o yaml | kubectl apply -f -
        shell: bash

      - name: Apply remaining Kubernetes manifests
        run: |
          kubectl apply -f k8s/data-services.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
        shell: bash

      - name: Wait for work loads
        run: |
          kubectl -n helix rollout status deployment/postgres --timeout=180s
          kubectl -n helix rollout status deployment/redis --timeout=180s
          kubectl -n helix rollout status deployment/mongo --timeout=180s
          kubectl -n helix rollout status deployment/helix-backend --timeout=180s
          kubectl -n helix rollout status deployment/helix-frontend --timeout=180s
        shell: bash

      - name: Verify deployment
        run: |
          kubectl -n helix get all
          kubectl -n helix get svc
          kubectl -n helix get pods -o wide
        shell: bash

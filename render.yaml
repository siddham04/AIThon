# Render Blueprint — one Web service (SPA + API), SQLite by default.
# Needs ~1GB+ RAM to build (sentence-transformers + npm). Use render-api.yaml + Vercel if Free tier OOMs.
# Apply: https://dashboard.render.com/ → New → Blueprint → connect this repo.
# After deploy, copy the service URL (https://<name>.onrender.com) into your hackathon "Demo Link".

services:
  - type: web
    name: helix-demo
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.all-in-one
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Allow a separate Vercel-hosted UI to call this API (see docs/VERCEL.md).
      - key: HELIX_CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: HELIX_DEMO_FAST
        value: "true"
      - key: HELIX_HACKATHON_AUTH
        value: "true"
      - key: HELIX_DEMO_EMAIL
        value: "demo@demo.com"
      - key: HELIX_DEMO_PASSWORD
        value: "demo123"
      # Skip sentence-transformers / PyTorch load — saves ~400 MB RAM on Free tier.
      - key: HELIX_DISABLE_EMBEDDINGS
        value: "1"
      # Optional — add in dashboard if you want the live LLM tier (Azure OpenAI).
      # Without these, the 3-tier resilience drops to the clause-grounded
      # mock + heuristic guarantors and the demo still works end-to-end.
      # See docs/NOVELTY.md pillar 3 and docs/PATH_TO_PRODUCTION.md §2.3.
      # - key: AZURE_OPENAI_ENDPOINT
      #   sync: false
      # - key: AZURE_OPENAI_API_KEY
      #   sync: false
      # - key: AZURE_OPENAI_DEPLOYMENT
      #   value: "o3"
      # - key: AZURE_OPENAI_API_VERSION
      #   value: "2024-12-01-preview"

databases: []

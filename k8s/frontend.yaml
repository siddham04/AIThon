apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: helix
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: helix-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-frontend
  namespace: helix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helix-frontend
  template:
    metadata:
      labels:
        app: helix-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/REPLACE_OWNER/ai-thon-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helix-ingress
  namespace: helix
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: helix.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  tls:
    - hosts:
        - helix.example.com
      secretName: helix-tls
